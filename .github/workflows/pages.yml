name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref so a pull request check never cancels a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the deck's JSX ahead of time so phones do not download and run Babel
  # before the first slide can appear. build.js parses its own output and fails if
  # the result is not a working, Babel-free page, so a broken deck cannot deploy.
  # This runs on pull requests too: the deploy path is the only thing standing
  # between a bad edit and the live site, so it gets checked before it is merged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
