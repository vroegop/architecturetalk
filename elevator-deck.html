/* ================= helpers ================= */
const TOTAL = 48 * 60; // whole session: 30 min talk + 15 min kata + close-off
const pad = n => String(n).padStart(2, '0');
const plain = t => String(t || '').replace(/<[^>]+>/g, '');
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return `${pad(m)}:${pad(s % 60)}`; };
const fmtDelta = s => { const sign = s < 0 ? '−' : '+'; s = Math.abs(Math.round(s)); return `${sign}${Math.floor(s / 60)}:${pad(s % 60)}`; };

function effectiveDark(theme) {
  if (theme === 'dark') return true;
  if (theme === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

/* ================= shared state sync ================= */
const CH = 'elevator-deck-v1';
const ME = Math.random().toString(36).slice(2);
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CH) : null;
const DEFAULT = { index: 0, theme: 'system', blackout: false, timer: { running: false, startedAt: null, acc: 0 }, ns: 20, script: true, step: 0, lang: 'en' };
function loadState() { try { const raw = localStorage.getItem(CH); if (raw) { const m = JSON.parse(raw); return { ...DEFAULT, ...m.state }; } } catch (e) {} return DEFAULT; }
function broadcast(state) { const msg = { src: ME, state }; try { bc && bc.postMessage(msg); } catch (e) {} try { localStorage.setItem(CH, JSON.stringify(msg)); } catch (e) {} }

function useSharedState() {
  const [state, setLocal] = useState(loadState);
  useEffect(() => {
    const onMsg = e => { const m = e.data; if (m && m.src !== ME && m.state) setLocal(s => ({ ...s, ...m.state })); };
    const onStorage = e => { if (e.key !== CH || !e.newValue) return; try { const m = JSON.parse(e.newValue); if (m.src !== ME) setLocal(s => ({ ...s, ...m.state })); } catch (err) {} };
    bc && bc.addEventListener('message', onMsg);
    window.addEventListener('storage', onStorage);
    return () => { bc && bc.removeEventListener('message', onMsg); window.removeEventListener('storage', onStorage); };
  }, []);
  const set = useCallback(patch => setLocal(s => { const n = { ...s, ...(typeof patch === 'function' ? patch(s) : patch) }; broadcast(n); return n; }), []);
  return [state, set];
}

/* ================= notes markup ================= */
function parseNotes(text) {
  const paras = text.trim().split(/\n\s*\n/);
  const keys = [];
  const rendered = paras.map((p, i) => {
    const parts = p.split(/(\[\[.+?\]\])/g).map((seg, j) => {
      const m = seg.match(/^\[\[(.+)\]\]$/);
      if (m) { keys.push(m[1]); return <mark key={j}>{m[1]}</mark>; }
      return seg;
    });
    return <p key={i}>{parts}</p>;
  });
  return { rendered, keys };
}

/* ================= building svg ================= */
function Building({ active, sweep, width = 530, lit }) {
  const [sweepIdx, setSweepIdx] = useState(0);
  useEffect(() => {
    if (!sweep) return;
    const id = setInterval(() => setSweepIdx(i => (i + 1) % FLOORS.length), 1800);
    return () => clearInterval(id);
  }, [sweep]);
  const idx = active ? FLOORS.findIndex(f => f.key === active) : (sweep ? sweepIdx : -1);
  const W = 690, H = 900, fh = 118, top = 90, shaftX = 60, shaftW = 70, bodyX = 150, bodyW = 250;
  const floorY = i => top + (FLOORS.length - 1 - i) * fh;
  const carY = idx >= 0 ? floorY(idx) + 14 : floorY(0) + 14;
  return (
    <svg className="bld" viewBox={`0 0 ${W} ${H}`} width={width} height={width * H / W} role="img" aria-label="Cross-section of a six-floor building with an elevator">
      <rect x={bodyX - 8} y={top - 40} width={bodyW + 16} height={FLOORS.length * fh + 48} rx="6" fill="var(--surface)" stroke="var(--line-strong)" strokeWidth="3" />
      <rect x={shaftX} y={top - 40} width={shaftW} height={FLOORS.length * fh + 48} rx="4" fill="var(--elev-glass)" stroke="var(--line-strong)" strokeWidth="3" />
      <line x1={shaftX + shaftW / 2} y1={top - 40} x2={shaftX + shaftW / 2} y2={top + FLOORS.length * fh + 8} stroke="var(--line)" strokeWidth="2" strokeDasharray="4 8" />
      {FLOORS.map((f, i) => {
        const y = floorY(i); const on = i === idx;
        return (
          <g key={f.key}>
            <line x1={bodyX - 8} y1={y + fh} x2={bodyX + bodyW + 8} y2={y + fh} stroke="var(--line)" strokeWidth="2" />
            {[0, 1, 2].map(w => <rect key={w} className={'win' + (on || (lit && lit.includes(f.key)) ? ' on' : '')} x={bodyX + 28 + w * 70} y={y + 26} width="44" height="60" rx="3" />)}
            <text className={'floor-lbl' + (on ? ' on' : '')} x={bodyX + bodyW + 26} y={y + 52}>{f.label}</text>
            <text className={'role-lbl' + (on ? ' on' : '')} x={bodyX + bodyW + 26} y={y + 82}>{f.role}</text>
          </g>
        );
      })}
      <g className="car" style={{ transform: `translateY(${carY}px)` }}>
        <rect x={shaftX + 9} y="0" width={shaftW - 18} height={fh - 28} rx="4" fill="var(--accent)" />
        <rect x={shaftX + 17} y="10" width={shaftW - 34} height={fh - 48} rx="2" fill="var(--bg)" opacity=".85" />
      </g>
    </svg>
  );
}

/* ================= frame that scales the canvas ================= */
function Frame({ children }) {
  const ref = useRef(null); const [sc, setSc] = useState({ s: .5, w: 800, h: 450 });
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(() => { const r = el.getBoundingClientRect(); const s = Math.min(r.width / 1600, r.height / 900); setSc({ s, w: r.width, h: r.height }); });
    ro.observe(el); return () => ro.disconnect();
  }, []);
  return <div className="frame" ref={ref}><div className="canvas" style={{ transform: `translate(-50%, -50%) scale(${sc.s})`, left: '50%', top: '50%', transformOrigin: '50% 50%' }}>{children}</div></div>;
}

/* ================= keyboard ================= */
function useKeys(handlers) {
  useEffect(() => {
    const on = e => {
      if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
      const k = e.key;
      const h = handlers[k] || handlers[k.toLowerCase()];
      if (h) { e.preventDefault(); h(e); }
    };
    window.addEventListener('keydown', on); return () => window.removeEventListener('keydown', on);
  }, [handlers]);
}

/* ================= help / prompts overlays ================= */
function Help({ onClose }) {
  return (
    <div className="overlay" onClick={onClose}><div className="sheet" onClick={e => e.stopPropagation()}>
      <h2>Controls</h2>
      <div className="keys">
        <div><kbd>→</kbd><kbd>Space</kbd>Next slide (or tap, or swipe left)</div><div><kbd>←</kbd>Previous slide (or tap the left quarter, or swipe right)</div>
        <div><kbd>Home</kbd><kbd>End</kbd>First / last</div><div><kbd>S</kbd>Open speaker view (or slides, from speaker view)</div>
        <div><kbd>T</kbd>Toggle light / dark</div><div><kbd>F</kbd>Fullscreen</div>
        <div><kbd>B</kbd>Blackout</div><div><kbd>K</kbd>Start / pause timer</div>
        <div><kbd>R</kbd>Reset timer</div><div><kbd>L</kbd>Listen: play / pause narration (when audio files are present)</div><div><kbd>D</kbd>Toggle Dutch / English for the speaker notes and script (narration is English)</div><div><kbd>X</kbd>Show / hide the practice script</div><div><kbd>V</kbd>Flip this window between slides and speaker view</div><div><kbd>?</kbd>This help</div>
      </div>
      <h3>Two screens</h3>
      <ul>
        <li>Open this file twice: once as slides on the projector, once with <span className="mono">#speaker</span> added to the URL on your laptop. Pressing <kbd>S</kbd> opens the other one for you. If the hash is stripped by your host, open it twice and press <kbd>V</kbd> in one window instead.</li>
        <li>Both windows share slide position, theme and timer through BroadcastChannel and localStorage, so either window can drive.</li>
        <li>The timer starts automatically on your first “next”, or press <kbd>K</kbd>. The delta compares your elapsed time to the planned start time of the current slide.</li>
      </ul>
      <h3>Why these two themes</h3>
      <ul>
        <li><b>Light theme, dark text on cool near-white.</b> Positive polarity gives measurably better legibility and proofreading accuracy than light-on-dark (Piepenbrock, Mayr &amp; Buchner, Ergonomics 2013; replicated for older adults 2014). Use it in bright rooms.</li>
        <li><b>Dark theme, off-white on deep navy, not black.</b> In a dim room a bright slide is a glare source; a dark ground reduces pupil contraction and eye fatigue. Pure white on pure black causes halation for many viewers with astigmatism, so both are softened.</li>
        <li><b>Contrast at or above 7:1</b> for body text in both themes (WCAG AAA), which matters at projector distance.</li>
        <li><b>One accent colour.</b> Red-orange on a cool ground is pre-attentively salient: viewers find it before they read (Treisman &amp; Gelade, feature-integration theory, 1980). Using a single accent is what keeps that effect working.</li>
        <li><b>One idea per slide, large type, no redundant text.</b> Mayer’s multimedia principles (coherence, signalling, redundancy) show recall drops when slides duplicate the speaker. Your notes hold the words; the slide holds the anchor.</li>
        <li>No theme is “proven most engaging”. Engagement comes from the stories and the pauses; the theme’s job is to never get in the way.</li>
      </ul>
      <div className="row"><button className="btn" onClick={onClose}>Close</button></div>
    </div></div>);
}

/* ================= main (audience) view ================= */
function MainView({ state, set, dark, openOther }) {
  const [help, setHelp] = useState(false);
  const touchRef = useRef(null); const swipedRef = useRef(false);
  const slide = SLIDES[state.index];
  /* ---- listen mode: narration audio + captions + auto-advance ---- */
  const track = AUDIO[slide.id];
  const audioRef = useRef(null);
  const onRef = useRef(false);
  const [ls, setLs] = useState(() => { let c = false; try { c = localStorage.getItem('deck-listen-collapsed') === '1'; } catch (e) {} return { on: false, playing: false, auto: true, transcript: false, t: 0, collapsed: c }; });
  const setCollapsed = c => { setLs(l => ({ ...l, collapsed: c })); try { localStorage.setItem('deck-listen-collapsed', c ? '1' : '0'); } catch (e) {} };
  useEffect(() => {
    const a = audioRef.current; if (!a) return;
    a.pause(); setLs(l => ({ ...l, playing: false, t: 0 }));
    if (!track) return;
    a.src = track.src; a.load();
    if (onRef.current) a.play().catch(() => {});
  }, [slide.id]);
  const startListen = useCallback(() => {
    const a = audioRef.current; if (!a || !track) return;
    onRef.current = true; setLs(l => ({ ...l, on: true }));

    a.play().catch(() => {});
  }, [track, slide, state.step, set]);
  const toggleListen = useCallback(() => {
    const a = audioRef.current; if (!a || !track) return;
    if (a.paused) startListen(); else { a.pause(); onRef.current = false; setLs(l => ({ ...l, on: false })); }
  }, [track, startListen]);
  const onEnded = () => {
    if (ls.auto && onRef.current && state.index < SLIDES.length - 1) {
      const n = state.index + 1; set({ index: n, step: SLIDES[n].steps || 0 });
    } else { onRef.current = false; setLs(l => ({ ...l, on: false, playing: false })); }
  };
  const cue = track ? (track.cues.find(c => ls.t >= c[0] && ls.t < c[1]) || (ls.t >= (track.cues[track.cues.length - 1] || [0, 0])[1] ? track.cues[track.cues.length - 1] : null)) : null;
  const seek = t0 => { const a = audioRef.current; if (a) { a.currentTime = t0; if (a.paused) startListen(); } };
  const next = useCallback(() => set(s => { const timer = s.timer.running || s.timer.acc > 0 ? s.timer : { running: true, startedAt: Date.now(), acc: 0 }; const steps = SLIDES[s.index].steps || 0; if ((s.step || 0) < steps) return { step: (s.step || 0) + 1, timer }; return { index: Math.min(SLIDES.length - 1, s.index + 1), step: 0, timer }; }), [set]);
  const prev = useCallback(() => set(s => { if ((s.step || 0) > 0) return { step: s.step - 1 }; const i = Math.max(0, s.index - 1); return { index: i, step: SLIDES[i].steps || 0 }; }), [set]);
  const keys = useMemo(() => ({
    ArrowRight: next, ' ': next, PageDown: next, ArrowDown: next, n: next,
    ArrowLeft: prev, PageUp: prev, ArrowUp: prev, p: prev,
    Home: () => set({ index: 0, step: 0 }), End: () => set({ index: SLIDES.length - 1, step: SLIDES[SLIDES.length - 1].steps || 0 }),
    t: () => set(s => ({ theme: effectiveDark(s.theme) ? 'light' : 'dark' })),
    f: () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); },
    b: () => set(s => ({ blackout: !s.blackout })),
    s: openOther, l: toggleListen,
    k: () => set(s => toggleTimer(s.timer)), r: () => set({ timer: { running: false, startedAt: null, acc: 0 } }),
    '?': () => setHelp(h => !h), Escape: () => { setHelp(false); setLs(l => ({ ...l, transcript: false })); },
  }), [next, prev, set, openOther, toggleListen]);

  return (
    <div className={'main' + (track && !ls.collapsed ? ' with-bar' : '')}
      onClick={e => { if (help || e.detail !== 1) return; if (e.clientX < window.innerWidth * 0.25) prev(); else next(); }}
      onTouchStart={e => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }}
      onTouchEnd={e => { const t0 = touchRef.current; if (!t0) return; const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y; touchRef.current = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - t0.t < 800) { swipedRef.current = true; setTimeout(() => { swipedRef.current = false; }, 400); dx < 0 ? next() : prev(); } }}
      onClickCapture={e => { if (swipedRef.current) { e.stopPropagation(); e.preventDefault(); } }}>
      <Frame><Slide slide={slide} i={state.index} total={SLIDES.length} dark={dark} step={state.step || 0} /></Frame>
      <div className="progress"><i style={{ width: `${(state.index / (SLIDES.length - 1)) * 100}%` }} /></div>
      <div className={'touchnav' + (track && !ls.collapsed ? ' up' : '')} onClick={e => e.stopPropagation()}>
        <button className="btn" aria-label="Previous slide" onClick={prev}>‹</button>
        <button className="btn" aria-label="Next slide" onClick={next}>›</button>
      </div>
      <div className={'hint' + (track && !ls.collapsed ? ' up' : '')}>{pad(state.index + 1)}/{SLIDES.length} · S speaker window · V speaker here{track ? ' · L listen' : ''} · ? help</div>
      {track && ls.collapsed && <button className="btn listen-pill" onClick={e => { e.stopPropagation(); setCollapsed(false); }} title="Show narration controls">{ls.playing ? '❚❚' : '▶'} Listen <kbd>L</kbd></button>}
      {track && <div className="listen" hidden={ls.collapsed} onClick={e => e.stopPropagation()}>
        <div className="bar" style={{ width: `${track.dur ? Math.min(100, ls.t / track.dur * 100) : 0}%` }} />
        <button className="btn pri" onClick={toggleListen}>{ls.playing ? 'Pause' : (ls.on ? 'Play' : 'Listen to this talk')} <kbd>L</kbd></button>
        <span className="lt">{fmt(ls.t)} / {fmt(track.dur)}</span>
        <div className={'cap' + (cue ? '' : ' idle')}>{cue ? cue[2] : 'Narration with captions. Plays through the whole deck.'}</div>
        <label className="chk"><input type="checkbox" id="auto-advance" checked={ls.auto} onChange={e => setLs(l => ({ ...l, auto: e.target.checked }))} /> Auto-advance</label>
        <button className="btn sm" onClick={() => setLs(l => ({ ...l, transcript: !l.transcript }))}>{ls.transcript ? 'Hide transcript' : 'Transcript'}</button>
        <button className="btn sm fold" onClick={() => setCollapsed(true)} title="Collapse">▾</button>
        <audio ref={audioRef} preload="auto" onTimeUpdate={e => setLs(l => ({ ...l, t: e.target.currentTime }))} onPlay={() => setLs(l => ({ ...l, playing: true, on: true }))} onPause={() => setLs(l => ({ ...l, playing: false }))} onEnded={onEnded} />
      </div>}
      {ls.transcript && track && <aside className="transcript" onClick={e => e.stopPropagation()}><h4>Transcript · slide {pad(state.index + 1)}</h4>{track.cues.map((c, i) => <p key={i} className={cue === c ? 'cur' : ''} onClick={() => seek(c[0])}>{c[2]}</p>)}</aside>}
      {state.blackout && <div className="blackout" />}
      {help && <Help onClose={() => setHelp(false)} />}
    </div>);
}

function toggleTimer(t) {
  if (t.running) return { timer: { running: false, startedAt: null, acc: t.acc + (Date.now() - t.startedAt) } };
  return { timer: { running: true, startedAt: Date.now(), acc: t.acc } };
}

/* ================= speaker view ================= */
function SpeakerView({ state, set, dark, openOther }) {
  const [help, setHelp] = useState(false);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(id); }, []);
  const slide = SLIDES[state.index];
  const nxt = SLIDES[state.index + 1];
  const elapsedMs = state.timer.acc + (state.timer.running ? now - state.timer.startedAt : 0);
  const elapsed = elapsedMs / 1000;
  const started = state.timer.running || state.timer.acc > 0;
  const delta = elapsed - slide.plan; // positive = behind plan
  const remaining = TOTAL - elapsed;
  const isNL = state.lang === 'nl' && !!NL[slide.id];
  const nlm = isNL ? NL[slide.id] : null;
  const notesSrc = nlm ? nlm.notes : slide.notes;
  const cueSrc = nlm ? (nlm.cue !== undefined ? nlm.cue : slide.cue) : slide.cue;
  const scriptSrc = nlm ? nlm.script : SCRIPTS[slide.id];
  const { rendered, keys } = useMemo(() => parseNotes(notesSrc), [notesSrc]);

  const next = useCallback(() => set(s => { const timer = s.timer.running || s.timer.acc > 0 ? s.timer : { running: true, startedAt: Date.now(), acc: 0 }; const steps = SLIDES[s.index].steps || 0; if ((s.step || 0) < steps) return { step: (s.step || 0) + 1, timer }; return { index: Math.min(SLIDES.length - 1, s.index + 1), step: 0, timer }; }), [set]);
  const prev = useCallback(() => set(s => { if ((s.step || 0) > 0) return { step: s.step - 1 }; const i = Math.max(0, s.index - 1); return { index: i, step: SLIDES[i].steps || 0 }; }), [set]);
  const hk = useMemo(() => ({
    ArrowRight: next, ' ': next, PageDown: next, ArrowDown: next, n: next,
    ArrowLeft: prev, PageUp: prev, ArrowUp: prev, p: prev,
    Home: () => set({ index: 0, step: 0 }), End: () => set({ index: SLIDES.length - 1, step: SLIDES[SLIDES.length - 1].steps || 0 }),
    t: () => set(s => ({ theme: effectiveDark(s.theme) ? 'light' : 'dark' })),
    f: () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); },
    b: () => set(s => ({ blackout: !s.blackout })), s: openOther,
    k: () => set(s => toggleTimer(s.timer)), r: () => set({ timer: { running: false, startedAt: null, acc: 0 } }),
    '?': () => setHelp(h => !h), Escape: () => setHelp(false),
    '+': () => set(s => ({ ns: Math.min(32, s.ns + 2) })), '=': () => set(s => ({ ns: Math.min(32, s.ns + 2) })), '-': () => set(s => ({ ns: Math.max(14, s.ns - 2) })),
    x: () => set(s => ({ script: !s.script })), d: () => set(s => ({ lang: s.lang === 'nl' ? 'en' : 'nl' })),
  }), [next, prev, set, openOther]);
  useKeys(hk);

  const clock = new Date(now);

  return (
    <div className="spk" style={{ '--ns': state.ns + 'px' }}>
      <div className="spk-bar">
        <div className="timer"><span className="k">Elapsed</span><span className="big" style={{ color: remaining < 0 ? 'var(--accent)' : 'var(--ink)' }}>{fmt(elapsed)}</span></div>
        <div className="timer"><span className="k">Remaining of {fmt(TOTAL)}</span><span className="big" style={{ fontSize: 30, color: 'var(--muted)' }}>{remaining < 0 ? '−' : ''}{fmt(Math.abs(remaining))}</span></div>
        <div className={'delta ' + (!started ? 'idle' : delta > 45 ? 'late' : 'ok')} title="Elapsed minus planned start of this slide">{started ? (delta > 0 ? `${fmtDelta(delta)} behind` : `${fmtDelta(delta)} ahead`) : 'timer idle'}</div>
        <span className="clock">{pad(clock.getHours())}:{pad(clock.getMinutes())}</span>
        <span className="sp" />
        <button className="btn sm" onClick={() => set(s => toggleTimer(s.timer))}>{state.timer.running ? 'Pause' : (started ? 'Resume' : 'Start')} <kbd>K</kbd></button>
        <button className="btn sm" onClick={() => set({ timer: { running: false, startedAt: null, acc: 0 } })}>Reset <kbd>R</kbd></button>
        <button className="btn sm" onClick={() => set(s => ({ theme: effectiveDark(s.theme) ? 'light' : 'dark' }))}>{dark ? 'Light' : 'Dark'} <kbd>T</kbd></button>
        <button className="btn sm" onClick={() => set(s => ({ blackout: !s.blackout }))}>{state.blackout ? 'Unblack' : 'Blackout'} <kbd>B</kbd></button>
        <button className="btn sm" onClick={() => set(s => ({ ns: Math.max(14, s.ns - 2) }))}>A−</button>
        <button className="btn sm" onClick={() => set(s => ({ ns: Math.min(32, s.ns + 2) }))}>A+</button>
        <button className="btn sm" onClick={() => set(s => ({ lang: s.lang === 'nl' ? 'en' : 'nl' }))} title="Notes and script language">{state.lang === 'nl' ? 'NL' : 'EN'} <kbd>D</kbd></button>
        <button className="btn sm" onClick={() => set(s => ({ script: !s.script }))}>{state.script ? 'Hide script' : 'Show script'} <kbd>X</kbd></button>
        <button className="btn sm" onClick={openOther}>Open slides <kbd>S</kbd></button>
        <button className="btn sm" onClick={() => setHelp(true)}>?</button>
        <button className="btn sm" onClick={prev}>‹</button>
        <button className="btn pri" onClick={next}>Next <kbd>→</kbd></button>
      </div>
      <div className="spk-body">
        <div className="spk-left">
          <div className="prev"><Frame><Slide slide={slide} i={state.index} total={SLIDES.length} dark={dark} step={state.step || 0} /></Frame><div className="cap"><span>Now · {slide.section}{slide.steps ? ` · step ${state.step || 0} of ${slide.steps}${(state.step || 0) < slide.steps ? ' · next reveals' : ''}` : ''}</span><span>{pad(state.index + 1)} / {SLIDES.length}</span></div></div>
          {nxt ? <div className="prev next"><Frame><Slide slide={nxt} i={state.index + 1} total={SLIDES.length} dark={dark} /></Frame><div className="cap"><span>Next · {nxt.section}</span><span>plan {fmt(nxt.plan)}</span></div></div> : <div className="prev next" style={{ padding: 16, color: 'var(--muted)', fontSize: 13 }}>Last slide. Start the workshop timer.</div>}
        </div>
        <div className="spk-right">
          <div className="notes-head"><span className="ttl">{plain(slide.title) || slide.section}</span><span className="plan">planned start {fmt(slide.plan)}{nxt ? ` · next at ${fmt(nxt.plan)}` : ''}</span></div>
          <div className="notes">
            {keys.length > 0 && <div className="chips">{keys.map((k, i) => <span key={i} className="chip">{k}</span>)}</div>}
            <div className="ntext">{rendered}</div>
            {cueSrc && <div className="cuebox"><span className="k">{isNL ? 'Publiek' : 'Audience'}</span>{cueSrc}</div>}
            {slide.src && <div className="srcbox">Source: {slide.src}</div>}
            {state.script !== false && scriptSrc && <div className="script"><span className="k">{isNL ? 'Oefenscript · lees hardop tot het van jou is' : 'Practice script · read it aloud until it is yours'}</span><div className="stext">{scriptSrc.trim().split(/\n\s*\n/).map((p, i) => <p key={i} dangerouslySetInnerHTML={{ __html: p.replace(/\[(.+?)\]/g, '<i>[$1]</i>') }} />)}</div></div>}
          </div>
        </div>
      </div>
      {help && <Help onClose={() => setHelp(false)} />}
    </div>);
}

/* ================= app ================= */
function App() {
  const [state, set] = useSharedState();
  useEffect(() => { Object.values(IMAGES).forEach(src => { const i = new Image(); i.src = src; }); }, []);
  const [override, setOverride] = useState(null);
  const [, force] = useState(0);
  useEffect(() => { const on = () => force(x => x + 1); window.addEventListener('hashchange', on); return () => window.removeEventListener('hashchange', on); }, []);
  useEffect(() => { const on = e => { if (e.key === 'v' || e.key === 'V') { if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return; setOverride(o => !(o === null ? /speaker/.test(location.hash) : o)); } }; window.addEventListener('keydown', on); return () => window.removeEventListener('keydown', on); }, []);
  const isSpeaker = override === null ? /speaker/.test(location.hash) : override;
  useEffect(() => {
    const root = document.documentElement;
    if (state.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
  }, [state.theme]);
  const [dark, setDark] = useState(effectiveDark(state.theme));
  useEffect(() => {
    setDark(effectiveDark(state.theme));
    const mq = window.matchMedia('(prefers-color-scheme: dark)'); const on = () => setDark(effectiveDark(state.theme));
    mq.addEventListener('change', on); return () => mq.removeEventListener('change', on);
  }, [state.theme]);
  const openOther = useCallback(() => {
    const url = location.href.replace(/#.*$/, '') + (isSpeaker ? '' : '#speaker');
    window.open(url, isSpeaker ? 'sixfloors-slides' : 'sixfloors-speaker');
  }, [isSpeaker]);
  return isSpeaker ? <SpeakerView state={state} set={set} dark={dark} openOther={openOther} /> : <MainView state={state} set={set} dark={dark} openOther={openOther} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</html>
