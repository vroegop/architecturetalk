<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six Floors, One Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-2: #E9EDF1;
    --ink: #101820;
    --ink-2: #2E3A45;
    --muted: #5A6873;
    --line: #D3DBE2;
    --line-strong: #A9B6C1;
    --accent: #C8401F;
    --accent-ink: #FFFFFF;
    --accent-soft: #F9E4DD;
    --teal: #0F7C82;
    --teal-soft: #DCEFF0;
    --mark: #FFE79A;
    --mark-ink: #2A1F00;
    --card: #FBF6EA;
    --card-line: #E4D9BE;
    --shadow: 0 2px 6px rgba(16,24,32,.08), 0 14px 40px rgba(16,24,32,.10);
    --elev-glass: rgba(15,124,130,.18);
    --window-off: #D3DBE2;
    --window-on: #FFD874;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1420;
      --surface: #142031;
      --surface-2: #1B2B40;
      --ink: #ECF0F4;
      --ink-2: #C9D3DC;
      --muted: #96A5B3;
      --line: #263A52;
      --line-strong: #3B5270;
      --accent: #F26A45;
      --accent-ink: #12100F;
      --accent-soft: #3B241C;
      --teal: #45BDC0;
      --teal-soft: #14343A;
      --mark: #5A4A12;
      --mark-ink: #FFF2C2;
      --card: #24201A;
      --card-line: #3D362A;
      --shadow: 0 2px 6px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
      --elev-glass: rgba(69,189,192,.22);
      --window-off: #22344B;
      --window-on: #FFD874;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1420;
    --surface: #142031;
    --surface-2: #1B2B40;
    --ink: #ECF0F4;
    --ink-2: #C9D3DC;
    --muted: #96A5B3;
    --line: #263A52;
    --line-strong: #3B5270;
    --accent: #F26A45;
    --accent-ink: #12100F;
    --accent-soft: #3B241C;
    --teal: #45BDC0;
    --teal-soft: #14343A;
    --mark: #5A4A12;
    --mark-ink: #FFF2C2;
    --card: #24201A;
    --card-line: #3D362A;
    --shadow: 0 2px 6px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
    --elev-glass: rgba(69,189,192,.22);
    --window-off: #22344B;
    --window-on: #FFD874;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #root { height: 100%; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif; font-variation-settings: "opsz" 96; letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; }

  /* ---------- slide frame (scales a 1600x900 canvas) ---------- */
  .frame { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
  .canvas {
    width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%;
    transform-origin: 0 0; background: var(--bg); color: var(--ink);
    overflow: hidden;
  }
  .slide { position: absolute; inset: 0; padding: 88px 104px; display: grid; }
  .slide .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .slide .eyebrow b { color: var(--accent); font-weight: 600; }
  .slide h1 { margin: 0; font-size: 112px; font-weight: 700; }
  .slide h2 { margin: 0; font-size: 72px; font-weight: 700; }
  .slide h3 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.01em; }
  .slide p { margin: 0; }
  .slide .body { font-size: 32px; line-height: 1.4; color: var(--ink-2); }
  .slide .body b, .slide li b { color: var(--ink); font-weight: 600; }
  .slide ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 22px; }
  .slide li { font-size: 32px; line-height: 1.35; color: var(--ink-2); position: relative; padding-left: 42px; }
  .slide li::before { content: ""; position: absolute; left: 0; top: .48em; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .slide .foot { position: absolute; left: 104px; right: 104px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 18px; color: var(--muted); letter-spacing: .06em; }
  .slide .foot .sec { text-transform: uppercase; }
  .slide .foot .n { font-variant-numeric: tabular-nums; }
  .slide .rule { height: 4px; width: 120px; background: var(--accent); border-radius: 2px; }

  .l-title { align-content: center; gap: 28px; }
  .l-title .sub { font-size: 40px; color: var(--muted); max-width: 26ch; line-height: 1.25; }
  .l-title .who { font-size: 26px; color: var(--muted); margin-top: 16px; }
  .l-title-grid { display: grid; grid-template-columns: 1fr 460px; gap: 60px; align-items: center; }
  .slide h1 em { font-style: normal; color: var(--accent); }
  .slide .credit { font-size: 21px; color: var(--muted); line-height: 1.4; max-width: 52ch; border-top: 1px solid var(--line); padding-top: 14px; }
  .l-reading { grid-template-rows: auto 1fr; gap: 36px; }
  .reads { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; align-content: start; }
  .read { display: grid; gap: 4px; padding: 18px 0; border-top: 1px solid var(--line); }
  .read .who { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -.01em; }
  .read .what { font-size: 23px; color: var(--ink-2); }
  .read .why { font-size: 21px; color: var(--muted); }
  .read:first-child .who { color: var(--accent); }

  .l-memo { grid-template-columns: 440px 1fr; gap: 64px; align-items: center; }
  .memo { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 34px 40px; font-family: "IBM Plex Mono", monospace; font-size: 19px; line-height: 1.45; color: var(--ink-2); transform: rotate(-1.2deg); max-height: 700px; }
  .memo .hdr { color: var(--muted); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px; }
  .memo ol { margin: 0; padding-left: 26px; display: grid; gap: 8px; }
  .memo .sig { margin-top: 16px; color: var(--accent); font-weight: 600; }

  .l-statement { align-content: center; gap: 36px; }
  .l-statement blockquote { margin: 0; font-size: 68px; font-weight: 600; line-height: 1.12; max-width: 22ch; }
  .l-statement blockquote em { font-style: normal; color: var(--accent); }
  .l-statement .attr { font-size: 28px; color: var(--muted); }
  .l-statement .attr b { color: var(--ink); font-weight: 600; }

  .l-building { grid-template-columns: 530px 1fr; gap: 80px; align-items: center; }
  .l-building .txt { display: grid; gap: 28px; }

  .l-floor { grid-template-columns: 470px 1fr; gap: 70px; align-items: center; }
  .l-floor .num { font-family: "IBM Plex Mono", monospace; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .l-floor .txt { display: grid; gap: 30px; }
  .l-floor .def { font-size: 34px; line-height: 1.35; color: var(--ink-2); max-width: 30ch; }
  .l-floor .def b { color: var(--ink); }

  .l-story { grid-template-columns: 640px 1fr; gap: 72px; align-items: center; }
  .l-story.wide { grid-template-columns: 740px 1fr; gap: 56px; }
  .l-story.wide .txt h2 { font-size: 54px !important; }
  .l-story.wide li { font-size: 27px; }
  .l-story.tall { grid-template-columns: 460px 1fr; gap: 72px; }
  .l-story .txt { display: grid; gap: 30px; }
  .l-story .txt .when { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }

  .l-diagram { grid-template-rows: auto 1fr; gap: 24px; }
  .l-diagram .cap { font-size: 26px; color: var(--muted); }
  .dgwrap { display: grid; place-items: start center; min-height: 0; }
  .dg { position: relative; width: 1392px; height: 520px; }
  .dg .bgl { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dnode { position: absolute; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 14px; padding: 16px 20px; font-size: 24px; line-height: 1.3; color: var(--ink); display: grid; gap: 6px; align-content: start; }
  .dnode .lbl, .dlabel, .dpanel-t { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .dnode.teal { border-color: var(--teal); } .dnode.teal .lbl { color: var(--teal); }
  .dnode.acc { border-color: var(--accent); background: var(--accent-soft); } .dnode.acc .lbl { color: var(--accent); }
  .dnode.fill { background: var(--teal); border-color: var(--teal); color: #fff; } .dnode.fill .lbl { color: rgba(255,255,255,.75); }
  .dnode.dim { border-style: dashed; color: var(--muted); background: transparent; }
  .dlabel { position: absolute; white-space: nowrap; }
  .dyear { position: absolute; transform: translateX(-50%); font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 54px; letter-spacing: -.02em; line-height: 1; }
  .dyear.dim { color: var(--line-strong); font-weight: 500; font-size: 40px; padding-top: 10px; }
  .dyear.acc { color: var(--accent); }
  .dfoot { position: absolute; font-size: 21px; color: var(--muted); text-align: center; line-height: 1.3; }
  .dpanel { position: absolute; border: 2px dashed var(--line); border-radius: 18px; }
  .dpanel-t { position: absolute; }
  .ppl { display: flex; gap: 5px; } .ppl i { width: 14px; height: 14px; border-radius: 50%; background: currentColor; opacity: .55; display: block; }
  .ppl i:nth-child(2) { opacity: .8; } .ppl i:nth-child(3) { opacity: 1; }
  .hex { width: 22px; height: 22px; display: block; }
  /* rows layout (speaking order, inverse conway) */
  .drows { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 28px; }
  .drow { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: center; }
  .drow.reveal { transition: opacity .5s ease, transform .5s ease; } .drow.reveal.held { opacity: 0; transform: translateY(14px); } .drow.reveal.shown { opacity: 1; transform: none; }
  .drow .rk { display: grid; gap: 8px; align-content: center; }
  .drow .rk b { font-family: "Bricolage Grotesque", sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .drow .rk span { font-size: 18px; color: var(--muted); }
  .drow .flow { display: flex; align-items: center; gap: 14px; }
  .drow .flow .dnode { position: relative; flex: 1; min-height: 132px; }
  .darrow { flex: 0 0 auto; display: grid; justify-items: center; gap: 4px; color: var(--muted); }
  .darrow.teal { color: var(--teal); }
  .darrow .al { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .bubble { position: relative; }
  .bubble::after { content: ""; position: absolute; left: 34px; bottom: -14px; width: 24px; height: 24px; background: inherit; border-right: 2px solid; border-bottom: 2px solid; border-color: inherit; transform: rotate(45deg); border-radius: 0 0 4px 0; }
  .bubble .q { font-size: 26px; font-weight: 500; }
  .bubble.dim .q { font-weight: 400; }
  .l-compare { grid-template-rows: auto 1fr; gap: 40px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-content: start; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 36px 40px; display: grid; gap: 20px; align-content: start; transition: border-color .4s ease, box-shadow .4s ease; }
  .col.hi { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
  .col h3 { font-size: 40px; }
  .col .k { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .col.hi .k { color: var(--teal); }
  .col ul { gap: 14px; } .col li { font-size: 27px; transition: opacity .45s ease; }
  .col li.held { opacity: 0; } .col li.shown { opacity: 1; }

  .l-tool { align-content: center; gap: 40px; }
  .toolcard { background: var(--surface); border: 1px solid var(--line); border-left: 12px solid var(--accent); border-radius: 12px; padding: 48px 56px; box-shadow: var(--shadow); display: grid; gap: 18px; max-width: 1200px; }
  .toolcard .k { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .toolcard .phrase { font-size: 56px; font-weight: 600; line-height: 1.12; }
  .toolcard .how { font-size: 28px; color: var(--muted); line-height: 1.4; }

  .l-rules { grid-template-rows: auto 1fr; gap: 44px; }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; align-content: start; }
  .rule-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 36px; display: grid; gap: 14px; align-content: start; }
  .rule-card .n { font-family: "Bricolage Grotesque", sans-serif; font-size: 72px; font-weight: 800; color: var(--accent); line-height: 1; }
  .rule-card h3 { font-size: 36px; }
  .rule-card p { font-size: 25px; color: var(--muted); line-height: 1.4; }

  .l-adr { grid-template-rows: auto 1fr; gap: 36px; }
  .adr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-content: start; }
  .adr .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 34px 36px; display: grid; gap: 12px; align-content: start; }
  .adr .box .k { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
  .adr .box h3 { font-size: 36px; }
  .adr .box p { font-size: 25px; color: var(--muted); line-height: 1.4; }
  .adr-file { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--muted); }

  .l-vocab { grid-template-rows: auto 1fr; gap: 40px; }
  .vocab { display: grid; grid-template-columns: 1fr 200px 1fr; gap: 28px; align-items: center; }
  .vocab .side { display: grid; gap: 16px; }
  .vocab .side .k { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .vocab .word { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 28px; font-size: 32px; font-weight: 500; }
  .vocab .mid { display: grid; place-items: center; }

  .l-bubbles { grid-template-rows: auto 1fr; gap: 20px; }
  .bubbles { position: relative; }
  .bub { position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 20px; font-weight: 500; line-height: 1.2; }
  .bub.big { background: var(--accent); color: var(--accent-ink); }
  .bub.mid { background: var(--teal); color: #fff; }
  .bub.small { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

  .l-deriv { grid-template-columns: 1fr 420px; gap: 72px; align-items: center; }
  .l-deriv .txt { display: grid; gap: 28px; }

  .l-c4 { grid-template-rows: auto 1fr; gap: 18px; }
  .c4grid { display: grid; grid-template-columns: 860px 1fr; gap: 44px; align-items: start; }
  .c4dg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; }
  .c4txt { display: grid; gap: 16px; align-content: start; }
  .c4txt .lead { font-size: 26px; line-height: 1.35; color: var(--ink); }
  .c4txt .lead b { color: var(--teal); }
  .c4txt ul { gap: 10px; } .c4txt li { font-size: 21px; padding-left: 30px; line-height: 1.35; } .c4txt li::before { width: 9px; height: 9px; top: .5em; }
  .c4txt .do { border-left: 6px solid var(--accent); padding: 12px 16px; background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 20px; line-height: 1.35; display: grid; gap: 4px; }
  .c4txt .do .k { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .c4txt .ref { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--muted); line-height: 1.45; }

  .l-handoff { align-content: center; justify-items: start; gap: 36px; }
  .l-handoff .big { font-size: 96px; font-weight: 700; line-height: 1; }
  .l-handoff .big em { font-style: normal; color: var(--accent); }
  .l-handoff .sub { font-size: 36px; color: var(--muted); }

  /* image panel */
  .img { position: relative; border-radius: 14px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); aspect-ratio: 4 / 3; max-width: 100%; box-shadow: var(--shadow); }
  .img.r169 { aspect-ratio: 16 / 9; width: 100%; }
  .img.r23 { aspect-ratio: 2 / 3; height: 690px; width: auto; justify-self: center; }
  .img.r916 { aspect-ratio: 9 / 16; height: 710px; width: auto; justify-self: center; }
  .l-title-grid .img.r23 { height: 690px; }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img .ph { position: absolute; inset: 0; display: grid; align-content: end; padding: 28px; gap: 8px; background-image: linear-gradient(to top, var(--surface) 0%, transparent 55%), repeating-linear-gradient(45deg, transparent 0 22px, var(--line) 22px 23px); }
  .img .ph .k { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .img .ph .t { font-size: 24px; color: var(--muted); line-height: 1.3; }

  /* building svg */
  .bld .car { transition: transform .9s cubic-bezier(.65,.05,.36,1); }
  .bld .floor-lbl { font-family: "IBM Plex Mono", monospace; font-size: 22px; fill: var(--muted); letter-spacing: .06em; }
  .bld .floor-lbl.on { fill: var(--ink); font-weight: 600; }
  .bld .role-lbl { font-family: "IBM Plex Sans", sans-serif; font-size: 20px; fill: var(--muted); }
  .bld .role-lbl.on { fill: var(--accent); font-weight: 600; }
  .bld .win { fill: var(--window-off); transition: fill .6s ease; }
  .bld .win.on { fill: var(--window-on); }
  @media (prefers-reduced-motion: reduce) { .bld .car { transition: none; } }

  /* ---------- main view chrome ---------- */
  .main { position: fixed; inset: 0; background: var(--bg); }
  .main .frame { position: absolute; inset: 0; }
  .progress { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); z-index: 5; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
  .hint { position: fixed; right: 16px; bottom: 14px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); opacity: .8; z-index: 5; }
  .blackout { position: fixed; inset: 0; background: #000; z-index: 50; }
  .main.with-bar .frame { bottom: 64px; }
  .hint.up { bottom: 74px; }
  .touchnav { display: none; position: fixed; left: 12px; bottom: 12px; z-index: 6; gap: 8px; }
  .touchnav.up { bottom: 74px; }
  .touchnav .btn { font-size: 26px; line-height: 1; padding: 6px 16px; }
  @media (pointer: coarse) { .touchnav { display: flex; } .hint { display: none; } }
  @media (max-width: 700px) {
    .listen { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
    .listen .cap { flex-basis: 100%; order: 10; font-size: 15px; max-height: 4.1em; }
    .listen .chk { font-size: 12px; } .listen .lt { font-size: 12px; }
    .main.with-bar .frame { bottom: 132px; } .touchnav.up { bottom: 142px; }
  }
  .listen[hidden] { display: none; }
  .listen .fold { margin-left: 4px; }
  .listen-pill { position: fixed; left: 14px; bottom: 14px; z-index: 6; }
  .listen { position: fixed; left: 0; right: 0; bottom: 4px; z-index: 6; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(0,0,0,.12); }
  .listen .lt { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .listen .cap { flex: 1; font-size: 17px; line-height: 1.35; color: var(--ink); min-height: 1.35em; max-height: 2.7em; overflow: hidden; }
  .listen .cap.idle { color: var(--muted); font-style: italic; }
  .listen .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }

  notes: `[[Mel Conway, 1967]]. Paper called "How Do Committees Invent?" Submitted to Harvard Business Review. [[Rejected]]: he had not proven his thesis. Datamation printed it in 1968. [[Fred Brooks]] called it Conway's Law in The Mythical Man-Month and it has been proven every year since.

Left: the org chart in January. Right: the system in December. [[Same shape]]. Always.

So, Scrum Masters: whoever [[splits the teams]] is drawing the architecture diagram, whether or not anybody calls it that. Next slide: how to do it [[on purpose]].` },

{ id: 'inverse', section: 'Floor 4', plan: 840, layout: 'diagram',
  title: 'The inverse Conway manoeuvre',
  cap: 'If the org chart becomes the architecture anyway, design the org chart to produce the architecture you want. Skelton & Pais, Team Topologies, 2019.',
  diagram: 'inverse',
  notes: `Top: Conway. Team structure becomes system structure, whether you like it or not.

{ id: 'pizza', section: 'Floor 4', plan: 885, layout: 'story',
  when: 'Amazon · 2002 to 2006', title: 'Two pizzas, and “you build it, you run it”',
  points: ['Teams capped at what two pizzas can feed.', 'Werner Vogels, 2006: every team runs in production what it builds. No throwing over the wall.', 'Both are <b>organisational</b> moves that produce an architecture, on purpose. Conway, used instead of suffered.'],
  image: { short: 'Two pizza boxes on top of a humming server rack' },
  src: 'Vogels interview with Jim Gray, ACM Queue, 2006.',
  notes: `Two Amazon rules. [[Two-pizza teams]]: a team is as big as two pizzas can feed. [[You build it, you run it]], [[Werner Vogels, 2006]]: the team that builds a service carries the pager for it.

Neither is a technical decision. Both are [[org decisions]]. Both produced the architecture Amazon wanted: small services, clear ownership, no wall to throw over.

That is Conway [[used]] instead of [[suffered]]. And it was a floor four move.` },

{ id: 'deriv', section: 'Why it is hard', plan: 1240, layout: 'deriv',
  title: 'Architects live in the first derivative',
  attr: 'Gregor Hohpe',
  body: 'The current state of a system is a fact. Its <b>rate of change</b> is the architecture. What is getting cheaper to change, and what is quietly getting more expensive?',
  image: { short: 'A tall building mid-construction, lower floors occupied, upper floors still scaffolding' },
  notes: `We have visited every floor. Now: why is riding the elevator so hard?

[[Hohpe]]: architects live in the [[first derivative]]. The current state of the system is a fact anyone can read. The [[rate of change]] is the architecture: what is getting cheaper to change and what is quietly getting more expensive. You cannot see a derivative in a snapshot. You see it by [[watching over time]], from more than one floor.` },

{ id: 'laws', section: 'Why it is hard', plan: 1275, layout: 'statement',
  quote: 'First law: <em>everything</em> in software architecture is a trade-off.<br>Second law: <em>why</em> is more important than how.',
  attr: '<b>Mark Richards & Neal Ford</b>, Fundamentals of Software Architecture, 2020',
  notes: `[[Richards and Ford]], two laws.

[[Everything is a trade-off]]. If you think you found something that is not, you have not found the trade-off yet. There is no answer. Seniors know more trade-offs; that is different from knowing the answer.

[[Why beats how]]. And "why" is the one question every floor can ask. The PO can ask it. The SM can ask it. The most junior developer can ask it.` },

{ id: 'naur', section: 'Why it is hard', plan: 1310, layout: 'story',
  when: 'Peter Naur · 1985', title: 'Programming as theory building',
  points: ['A program is not the code. It is the <b>theory</b> the team holds about how the code relates to the world.', 'The theory cannot be fully written down. It transfers by <b>working alongside</b> someone who has it.', 'So the theory must live on every floor, and nobody can ride the elevator alone.'],
  image: { short: 'Two people at a whiteboard at night; a thick binder untouched on a shelf' },
  src: 'Naur, “Programming as Theory Building,” Microprocessing and Microprogramming, 1985.',
  notes: `The deepest reason it is hard. [[Peter Naur, 1985]]. A program is not the code; it is the [[theory]] the team holds about how the code maps to the world.

The theory [[cannot be fully written down]]. Documentation helps, but the theory transfers by [[working alongside]] someone who already has it. This is why the consultants leave and the system quietly dies.

For us: the theory has to live on [[every floor]]. Which means you cannot ride alone. You have to decide things [[together]].` },

/* PRACTICE SCRIPTS — full spoken version per slide. Stage directions in [brackets]. Hide with X. */
const SCRIPTS = {
title: `Good afternoon. Before we get our hands dirty, I want to give you one picture to carry for the next thirty minutes.

Architecture is a building. Not a diagram, not a document. A building, with floors. Every one of you works on one of those floors, and most of you have never visited the others. Today we ride between them.

The picture belongs to Gregor Hohpe. He describes two floors. I am going to add four, and by the end I want you to argue with me about them.`,

memo: `Let me start with a memo. Amazon, around 2002. Jeff Bezos sends this to every team in the company. [Read slowly. Do not comment between lines.]

All teams will henceforth expose their data and functionality through service interfaces. Teams must communicate with each other through these interfaces. There will be no other form of interprocess communication allowed. It doesn't matter what technology they use. All service interfaces, without exception, must be designed from the ground up to be externalizable.

[Pause.] Anyone who doesn't do this will be fired.`,

niceday: `Thank you; have a nice day. [Wait for the laugh.]

We know this memo because Steve Yegge, who worked at Amazon and later at Google, retold it in 2011 in a post he thought was private. It was not.

That memo was written on the top floor of the building. It rebuilt the bottom floor. Every internal system became a service with an interface, and a few years later Amazon noticed it could sell those interfaces to the rest of us. That is where AWS came from. The most consequential architecture decision in Amazon's history, and no architect wrote it. Hold that thought.`,

building: `Here is the building, from the bottom. The basement: ops and infrastructure, the people who keep the lights on. The engine room: developers, where the code is written. Floor two: seniors, leads, anyone with "architect" in their title. Floor three: Product Owners. Floor four: Scrum Masters, agile coaches, anyone who shapes teams. And the penthouse: management.

Gregor Hohpe's version has two floors, the penthouse and the engine room, and he says the architect's job is to ride the elevator between them. The four floors in between are mine.

So. Which floor do you work on? [Hands per floor. Say each count back.] Remember your floor. I will need it at the end.`,

f1: `First stop, the engine room.

In 2003 Martin Fowler wrote an article called "Who Needs an Architect?", and in it he quotes Ralph Johnson: architecture is about the important stuff. Whatever that is. It sounds like a dodge. It is the most honest definition we have, because what counts as important changes per system, per year, per team.

Fowler adds a second definition: architecture is the shared understanding the expert developers have of the system. Shared. So if there is a diagram on the wiki that nobody on the team could redraw from memory, that diagram is not the architecture. The architecture is whatever is actually in your heads.`,

booch: `Grady Booch sharpens the word "important". Architecture is the significant decisions, where significant is measured by cost of change. Not by how long the meeting was. Not by who attended. Cost of change.

Look at the circles. Which database, and who owns the schema: big. Sync or async between two teams: big. Tabs or spaces: tiny, however long the argument lasted.

Now look at the big ones again. Nearly every one is about the boundary between one team and another. Hold that. It comes back on floors three and four.`,

alarm: `The engine room's war story. July 20th, 1969. Eagle is descending to the moon. A switch for the rendezvous radar is in the wrong position, and it starts flooding the guidance computer with work it does not need. The computer is at capacity. On the display: 1202. Program alarm. Nobody in Mission Control has seen it in a real flight.

Here is what saves the landing. Years earlier, Margaret Hamilton's team at MIT built the software around an asynchronous executive with priority scheduling. Under overload it drops the least important tasks and keeps the ones that matter. So the computer sheds the radar work, keeps flying, and Armstrong lands with seconds of fuel to spare.

That decision was made in a room in Cambridge, Massachusetts, years earlier. Nobody clapped.`,

'alarm-tl': `Look at the gap. 1966: the executive is designed. 1968: Apollo 8 flies, nothing happens. 1969: the alarm, and the decision pays off. Three years between deciding and knowing.

This is the first thing that makes architecture hard, and I want to say it plainly: the feedback loop is measured in years. You cannot learn from a loop that long just by living through it. You would get ten repetitions in a career. We are going to need another way to practise. Park that. It is where we end up.`,

beck: `So, engine room. What is hard, what is easier.

Hard: architecture hides inside your pull requests. You extract an interface, you split a module, and nobody tells you that was architecture.

Easier: Kent Beck's line from 2012. For each desired change, make the change easy [warning: this may be hard], then make the easy change. That is David Parnas's 1972 paper in one sentence: decompose by what will change. You already do this. The only ask for this floor is to start calling it what it is, out loud, so the other floors can hear.`,

f3: `Up one floor. Seniors, leads, architects. The people who know the most.

Here is the question for this floor: what is the most valuable thing you can do with what you know? The obvious answer is to give the answer. And an answer fixes today's decision. But a question the team learned to ask fixes every decision after it, including the ones you are not in the room for.

So the job on this floor is to spend your knowledge on getting everyone to ask the right questions. What changes most here? What does this make expensive later? Why not the other option? And then, once the questions are on the table, explain the trade-off behind your answer, so the room learns how you think and not just what you concluded.

There is one habit that makes this possible, and it is uncomfortable: speak last. If you speak first, the questions never get asked. Let me show you why that order matters so much.`,

fowler: `Same Fowler article, two archetypes. Architectus Reloadus, named for the Matrix: decides, then hands down. Makes the decision alone, communicates through documents. Architectus Oryzus, from oryza, rice: pairs, mentors, and works to disappear. Works inside the team on real problems, communicates through conversation and code.

A question for you. Which one does your organisation reward? [Take two or three answers. Usually Reloadus, because Reloadus looks decisive.] And which one does it need? [Wait for the room. Then press next.]

Oryzus. And here is the part that decides it. Reloadus is the single point of failure for understanding: the team learns what was decided, never why, and when Reloadus leaves, the understanding leaves with them. Oryzus measures success by how little they are needed. The team learns why, and can decide next time without them.

The Oryzus architect's real job is to make decisions visible, not to make them alone.`,

hoare: `Tony Hoare, Turing Award lecture, 1980. [Read it slowly.] There are two ways of constructing a software design. One way is to make it so simple that there are obviously no deficiencies. The other way is to make it so complicated that there are no obvious deficiencies.

Read it again. "Obviously no deficiencies." "No obvious deficiencies." Same words, opposite systems. Keep Hoare in mind for one more slide.`,

null: `Same Tony Hoare. 1965, he is designing the language ALGOL W, and he adds the null reference. Why? In his own words: because it was so easy to implement. Not because it was right. Because it was easy.

2009, QCon London. He stands on a stage and calls it his billion-dollar mistake, counting the crashes and vulnerabilities across forty years of software.

This is the point for floor two. The most decorated engineer in the history of our field shipped a billion-dollar architectural hole because it was the easy option that afternoon. Seniors are not oracles. Seniors are people who know more trade-offs than others. That is valuable. It is not the same as knowing the answer.`,

silence: `A meeting you have all been in. The senior says, we will use X. The room nods, because who is going to argue. Decision made, unexamined. Nobody learned anything, including the senior.

What would you change? [Take one answer. Then press next.]

Flip the order. The junior asks, why not Y? Now the senior has to say the trade-off out loud. Now the decision has been examined twice, and the junior just learned what a senior knows.

Jerry Weinberg described this in 1971 and called it egoless programming. Woody Zuill's team at Hunter Industries rediscovered it in 2011 when they started programming as a whole team, all day, at one screen: the seniors said they learned from juniors daily, because the juniors kept asking why.

Now, I can hear the objection. Surely the senior's answer is usually right? Let me introduce you to the most decorated engineer in the history of our field.`,

'senior-tool': `The tool for floor two. Four words, two habits.

Ask first. Open every design discussion with a question instead of an answer. The questions from a few minutes ago will do: what changes most here? What does this make expensive later? Why not the other option?

Speak last. Let the room reason before you do. It will feel slow. It is not; it is the only way the questions get asked at all.

And then, when you do speak, explain the trade-off behind your answer, not just the conclusion. The decision gets examined twice, and the team learns how you think, which means they can make the next one without you.

If Tony Hoare can ship a billion-dollar hole because it was easy that afternoon, the second pair of eyes is not a courtesy. It is the architecture.`,

f7: `Floor three. Product Owners. The floor most architecture talks skip, and I think that is the biggest mistake in our field.

[Look at them.] You already do architecture. You decide the order. The first three things that get built become the skeleton everything after them has to fit, and every "later" on your backlog is a loan with interest. That is architecture in the language of time, and nobody in the engine room translates it.

Proof: the most famous phrase in our field was invented for your floor.`,


debt: `Everyone in this room uses the phrase "technical debt". Most people think it is a developer's complaint. It is the opposite.

1992. Ward Cunningham is building a portfolio management system called WyCash for a financial company. He needs to explain to his bosses, who are not technical, why shipping now and cleaning up the code later is a legitimate decision and not sloppiness. So he borrows their vocabulary. It is a loan. You take on debt to ship sooner, you pay interest as slower changes, and at some point you repay the principal. His bosses understood instantly, because he was speaking their language.

The most-used phrase in software architecture was invented as a translation device for the PO's floor. That is what the best architects do. They invent words that let two floors see the same thing.`,


'po-tool': `The tool for floor three is one sentence, and it is a question about time. What does this make expensive later?

Ask it once per refinement, about whatever is at the top of the backlog. You do not need a diagram. You do not need to know what a service mesh is. You do not need permission. It is Booch's definition turned into a question a PO can ask on Monday morning.

And every time a developer answers it, a piece of the theory of the system moves from their head into yours.`,

f12: `Floor four. Scrum Masters, agile coaches, anyone who shapes teams.

One sentence for this floor. The Product Owner decides when. You decide who builds it together. That is architecture in the language of space: team boundaries become system boundaries. And there is a fifty-year-old law that says so. It started as a rejected paper.`,
conway: `1967. Mel Conway writes a paper called "How Do Committees Invent?" The thesis: any organisation that designs a system will produce a design whose structure is a copy of the organisation's communication structure. He sends it to Harvard Business Review. They reject it: he has not proven it. Datamation publishes it in 1968. Fred Brooks names it Conway's Law in The Mythical Man-Month, and it has been proven every single year since.

Left: the org chart in January. Three teams. Right: the system in December. Three services. Same shape. It is always the same shape.

So, Scrum Masters: whoever splits the teams is drawing the architecture diagram, whether or not anyone calls it that. Which raises the obvious question: if it happens anyway, can you do it on purpose?`,

inverse: `Yes. Top row, Conway's Law: team structure becomes system structure, whether you like it or not.

Bottom row, the inverse Conway manoeuvre. Start from the system you want. Design the teams so that Conway's Law produces it. Matthew Skelton and Manuel Pais made this rigorous in Team Topologies in 2019: stream-aligned teams, platform teams, and cognitive load as the limit on what one team can own.

This is the Scrum Master's architecture tool. Think back to the last time you re-formed a team. Did anyone show you the architecture diagram? They should have. You were editing it.`,

pizza: `Two Amazon rules. The two-pizza team: a team is as big as two pizzas can feed, and no bigger. And Werner Vogels, 2006: you build it, you run it. The team that builds a service carries the pager for it.

Neither of those is a technical decision. Both are organisational. And both produced exactly the architecture Amazon wanted: small services, clear ownership, nothing thrown over a wall.

That is Conway used on purpose instead of suffered by accident. And it was a floor-four move.`,

spotify: `A caution for this floor. 2012, Henrik Kniberg publishes a whitepaper describing how Spotify organises: squads, tribes, chapters, guilds. He calls it a snapshot of an experiment. The world reads it as a template. Consultancies sell it. Companies reorganise around it.

2020, former Spotify people say publicly: it was aspirational, it never fully worked that way, and Spotify has moved on. The template outlived the thing it described.

Copying another company's organisation is planting coral in a forest. It was beautiful where it grew. Design your own teams for your own system.`,

'sm-tool': `The tool for floor four. In a few minutes we do an architecture kata: small groups, a one-page fictional brief, a time box, then present to each other and take questions.

Here is what I want you to notice while we do it: a kata needs a facilitator far more than it needs an architect. Time-boxing. Making sure the quiet person speaks. Rotating who holds the marker. That is your craft already.

So watch what I do in the workshop, because you are going to run one of these at work.`,

fp: `Top floor. Management. Where the memo came from.

Gregor Hohpe's observation is that the penthouse and the engine room stopped talking. Not out of malice. They speak different languages, and the elevator that used to connect them stopped running. Let me show you the two languages.`,

vocab: `Left: how the penthouse describes the system. Options. Risk. Time to market. Cost of delay. Right: how the engine room describes the same system. Coupling. Latency. Deploy frequency. Blast radius. Same system, described twice, and the two columns never meet.

The elevator's job is translation in both directions. "Coupling" rides up and becomes: we cannot ship a payments feature without re-testing orders, so every payments feature costs two teams. "Time to market" rides down and becomes: payments must be deployable on its own by the third quarter.

If nobody rides, each floor optimises for its own vocabulary, and the building slowly stops working.`,

netflix: `The penthouse story. Netflix, August 2008. Netflix still mails DVDs. A database corruption stops shipping for three days.

The obvious fix is a bigger, better database. The penthouse concludes something different: the single points of failure are the architecture. They bet the company on moving to Amazon's cloud. The engine room then earns that bet with Chaos Monkey: software that kills production servers at random, on purpose, so the architecture is forced to survive it.

A penthouse decision, translated down, executed up. That is the elevator working.`,


adr: `Hard for the penthouse: there is no feedback loop. Decisions go down; consequences rarely come back up in a form anyone recognises.

Easier: Michael Nygard, 2011. Architecture Decision Records. One short file per significant decision, kept with the code: context, decision, consequences. Without it, a decision is a rumour within a year. With it, the penthouse reads why, the engine room reads what, and a new hire reads both. It is the elevator's logbook.`,

deriv: `Every floor visited. So why is the elevator hard to ride?

Hohpe: architects live in the first derivative. The state of a system is a fact anyone can read. The rate of change is the architecture: what is getting cheaper to change, and what is quietly getting more expensive. You cannot see that in a snapshot. Only over time, and from more than one floor.`,

laws: `Richards and Ford, two laws. First: everything in software architecture is a trade-off. If you think you found something that is not, you have not found the trade-off yet. Seniors know more trade-offs; that is not the same as knowing the answer.

Second: why is more important than how. And why is the one question every floor can ask.`,

naur: `The deepest reason. Peter Naur, 1985: a program is not the code. It is the theory the team holds about how the code relates to the world. That theory cannot be fully written down. It transfers by working alongside someone who has it, which is why the consultants leave and the system quietly dies.

So the theory has to live on every floor. You cannot ride the elevator alone.`,

brandolini: `Alberto Brandolini, who invented event storming: it is not the domain expert's knowledge that goes to production. It is the developer's assumptions about it. His fix is not a better document. It is everyone at one wall, at the same time.

Put the expert in the room. Not in the ticket. In the room.`,

lauren: `[Slow down. This is the quiet centre of the talk.]

Margaret Hamilton again. Late 1960s. She sometimes brings her daughter Lauren, four years old, to the lab. Lauren plays with the simulator and selects P01, a pre-launch program, in the middle of a simulated flight. Crash.

Hamilton wants to add a guard. NASA says no: astronauts are trained never to make a mistake.

Apollo 8, December 1968. Jim Lovell selects P01. The navigation data is gone. Nine hours to rebuild it. [Pause.] Then she got her guard.

A four-year-old found the flaw the experts were trained to ignore.`,

kay: `Alan Kay: a change in perspective is worth eighty IQ points. The junior's ignorance of your codebase is a perspective you cannot buy. So is the PO's. So is the Scrum Master's habit of noticing who has not spoken yet.`,

rules: `Three rules for the next fifteen minutes. One: rotate the marker. Whoever holds it draws, and every three minutes it moves. Two: junior speaks first, senior last. Three: seniors ask, then tell. Five minutes of questions only, then trade-offs. Never answers.`,

close: `[Let the elevator sweep while you speak.]

Engine room: make the change easy. Floor two: speak last. Floor three: ask what gets expensive. Floor four: design the teams. Penthouse: keep the logbook.

Six floors. One building. And for the next fifteen minutes, the elevator stops at all of them.`,

handoff: `Groups of four. At least two floors in every group. Stand up. Go.

[Walk the room. Break up any group that is all engine room. Advance to the C1 slide.]`,

c1: `[Ninety seconds, then start the timer.]

Here is what you draw. One box: the system in your brief. Around it, every person who uses it, and every other system it depends on. Between them, arrows, and every arrow gets a label in plain words: places orders, charges cards, sends confirmations.

No technology. Nothing inside the box. No boxes for teams. This is level one of Simon Brown's C4 model, the system context, and it is the diagram every floor in this room can read.

Your test for done: can the Product Owner in your group read the whole thing aloud without help? If not, redraw it.

Three rules, once more. Rotate the marker every three minutes. The junior opens. Seniors ask only, for the first five minutes. Fifteen minutes. Go.`,

c2: `[Two minutes for this slide and the next, together.]

You drew level one. Here is what the next round looks like. Level two, containers: open the box and show the separately deployable pieces inside. A web app in React, a mobile app, an API in Spring, a PostgreSQL database. Each with its technology, each an arrow with a protocol.

Container here does not mean Docker. It means anything that runs or stores on its own.

And notice: this is the level where floor four becomes visible. One team, one container is the two-pizza rule, drawn. If you want the second kata at work: same brief, same groups, one week later, draw this.`,

c3: `Level three, components: open one container, the API in this example, and show its major building blocks. Controllers, services, repositories, a facade in front of the payment provider. Use the words your codebase already uses.

Most teams stop here. Level four is code, and Simon Brown's own advice is: generate it from the IDE, never draw it by hand.

One last callback to the engine room. This is where Parnas's question lives. Which of these will change most? That is where your boundary belongs.

Three diagrams, three zoom levels, and every one of them readable by more than one floor. Thank you.`,

reading: `[Final slide, leave it up as people pack up. If anyone asks where to start:] Hohpe's book for the elevator. c4model.com for the diagrams. Then architecturalkatas.com for briefs you can run at work.`,
};

const NL = {
title: {
  notes: `Welkom. Voor de workshop wil ik dertig minuten besteden aan één idee: [[architectuur is een gebouw]], en ieder van jullie werkt op een [[andere verdieping]].

Vooraf één zin credit: de lift is de metafoor van [[Gregor Hohpe]], uit The Software Architect Elevator. Hij beschrijft [[twee verdiepingen]]. Ik voeg er vandaag [[vier]] aan toe.

Start de timer nog niet. Start hem bij het eerste woord van de memo.`,
  script: `Goedemiddag. Voordat we aan de slag gaan, wil ik jullie één beeld meegeven voor de komende dertig minuten.

Architectuur is een gebouw. Geen diagram, geen document. Een gebouw, met verdiepingen. Ieder van jullie werkt op een van die verdiepingen, en de meesten van jullie zijn nog nooit op de andere geweest. Vandaag rijden we ertussen.

Het beeld is van Gregor Hohpe. Hij beschrijft twee verdiepingen. Ik voeg er vier aan toe, en aan het eind wil ik dat jullie daarover met me in discussie gaan.` },

memo: {
  notes: `Lees de memo [[langzaam]], regel voor regel. Geen commentaar tussendoor. Het is een echte memo, [[Jeff Bezos, 2002]], naverteld door [[Steve Yegge]] in een Google+ post die niet openbaar had moeten zijn.

De laatste regel is de clou. Pauzeer ervoor.`,
  script: `Ik begin met een memo. Amazon, rond 2002. Jeff Bezos stuurt dit naar elk team in het bedrijf. [Lees langzaam. Geen commentaar tussendoor.]

Alle teams zullen vanaf nu hun data en functionaliteit ontsluiten via service-interfaces. Teams communiceren met elkaar via deze interfaces. Geen enkele andere vorm van communicatie tussen processen is toegestaan. Welke technologie ze gebruiken maakt niet uit. Alle service-interfaces, zonder uitzondering, moeten vanaf de grond ontworpen zijn om naar buiten toe aangeboden te kunnen worden.

[Pauze.] Wie dit niet doet, wordt ontslagen.` },

niceday: {
  notes: `Laat de lach landen, en word dan in één zin serieus: [[die memo is in het penthouse geschreven]]. Hij heeft de [[machinekamer verbouwd]]. Het is de reden dat [[AWS]] bestaat.

De belangrijkste architectuurbeslissing in de geschiedenis van Amazon. [[Geen architect heeft hem geschreven]]. Vandaag rijden we tussen de verdieping waar hij geschreven is en de verdieping waar hij landde.`,
  script: `Dank u; nog een fijne dag. [Wacht op de lach.]

We kennen deze memo omdat Steve Yegge, die bij Amazon werkte en later bij Google, hem in 2011 navertelde in een post die hij privé dacht te houden. Dat was hij niet.

Die memo is op de bovenste verdieping van het gebouw geschreven. Hij heeft de onderste verdieping verbouwd. Elk intern systeem werd een service met een interface, en een paar jaar later merkte Amazon dat het die interfaces aan de rest van ons kon verkopen. Daar komt AWS vandaan. De belangrijkste architectuurbeslissing in de geschiedenis van Amazon, en geen architect heeft hem geschreven. Hou die gedachte vast.` },

building: {
  notes: `Wijs naar het gebouw. Noem de verdiepingen van onder naar boven: [[Kelder: ops]]. [[Machinekamer: developers]]. [[Tweede: seniors]] en iedereen met "architect" in de functietitel. [[Derde: Product Owners]]. [[Vierde: Scrum Masters]] en iedereen die teams vormt. [[Penthouse: management]].

Vraag handen per verdieping. Tel hardop. Dat komt terug: aan het eind vraag je ze [[groepen over verdiepingen heen]] te vormen.

Credit nog een keer, kort: [[Hohpe]] beschrijft het penthouse en de machinekamer. De vier verdiepingen ertussen zijn [[mijn toevoeging]], en daar mogen jullie het mee oneens zijn.`,
  cue: '"Op welke verdieping werk jij?" Handen per verdieping. Zeg de aantallen terug zodat mensen zich geteld voelen.',
  script: `Hier is het gebouw, van onderaf. De kelder: ops en infrastructuur, de mensen die het licht aan houden. De machinekamer: developers, waar de code geschreven wordt. De tweede verdieping: seniors, leads, iedereen met "architect" in de titel. De derde: Product Owners. De vierde: Scrum Masters, agile coaches, iedereen die teams vormt. En het penthouse: management.

Gregor Hohpe's versie heeft twee verdiepingen, het penthouse en de machinekamer, en hij zegt dat het de taak van de architect is om met de lift tussen die twee te rijden. De vier verdiepingen ertussen zijn van mij.

Dus. Op welke verdieping werk jij? [Handen per verdieping. Zeg elk aantal terug.] Onthoud je verdieping. Ik heb hem aan het eind nodig.` },

f1: {
  notes: `De lift stopt eerst in de machinekamer, want daar woont het grootste deel van de zaal.

Definitie van [[Ralph Johnson]], via [[Martin Fowler, 2003]]: architectuur gaat over de belangrijke dingen, wat dat ook mogen zijn. Klinkt als een grap. Het is de eerlijkste definitie die we hebben. Fowler voegt een tweede toe: architectuur is [[het gedeelde begrip]] dat de ervaren developers van het systeem hebben.

Als het gedeeld begrip is, dan is een diagram dat niemand begrijpt [[geen architectuur]].`,
  script: `Eerste halte, de machinekamer.

In 2003 schreef Martin Fowler een artikel met de titel "Who Needs an Architect?", en daarin citeert hij Ralph Johnson: architectuur gaat over de belangrijke dingen. Wat dat ook mogen zijn. Het klinkt als een ontwijkend antwoord. Het is de eerlijkste definitie die we hebben, want wat belangrijk is verandert per systeem, per jaar, per team.

Fowler voegt een tweede definitie toe: architectuur is het gedeelde begrip dat de ervaren developers van het systeem hebben. Gedeeld. Dus als er een diagram op de wiki staat dat niemand in het team uit het hoofd zou kunnen natekenen, dan is dat diagram niet de architectuur. De architectuur is wat er werkelijk in jullie hoofden zit.` },

booch: {
  notes: `[[Grady Booch]]: architectuur is de verzameling significante ontwerpbeslissingen, waarbij [[significant gemeten wordt in de kosten van verandering]].

Niet de grootte van de vergadering. Niet wie erbij was. Kosten van verandering. De grote cirkels zijn de beslissingen die je [[volgende sprint niet terugdraait]]. De kleine wel.

Let op: bijna alle grote gaan over [[grenzen tussen teams]]. Hou dat vast voor de derde en vierde verdieping.`,
  script: `Grady Booch scherpt het woord "belangrijk" aan. Architectuur is de verzameling significante beslissingen, waarbij significant gemeten wordt in de kosten van verandering. Niet in hoe lang de vergadering duurde. Niet in wie erbij was. Kosten van verandering.

Kijk naar de cirkels. Welke database, en wie is eigenaar van het schema: groot. Synchroon of asynchroon tussen twee teams: groot. Tabs of spaties: klein, hoe lang de discussie ook duurde.

Kijk nu nog eens naar de grote. Bijna elke gaat over de grens tussen het ene team en het andere. Hou dat vast. Het komt terug op de derde en de vierde verdieping.` },

alarm: {
  notes: `Het oorlogsverhaal van deze verdieping. Het team van [[Margaret Hamilton]] bij MIT bouwde een [[asynchrone executive]] met [[prioriteitsplanning]]: bij overbelasting het onbelangrijke werk laten vallen, het belangrijke behouden.

Drie jaar later, tijdens de maanlanding, overspoelt een schakelaar van de [[rendez-vousradar]] de computer. [[1202-alarm]]. De executive laat de laagste prioriteiten vallen en blijft sturen. Armstrong landt.

Punt: een beslissing uit de machinekamer, genomen in [[stilte]], jaren voordat iemand wist dat hij ertoe deed. Zo voelt architectuur op deze verdieping.`,
  script: `Het oorlogsverhaal van de machinekamer. 20 juli 1969. De Eagle daalt af naar de maan. Een schakelaar van de rendez-vousradar staat verkeerd, en die begint de boordcomputer te overspoelen met werk dat hij niet nodig heeft. De computer zit aan zijn maximum. Op het display: 1202. Programma-alarm. Niemand in Mission Control heeft dat ooit in een echte vlucht gezien.

Dit redt de landing. Jaren eerder heeft het team van Margaret Hamilton bij MIT de software gebouwd rond een asynchrone executive met prioriteitsplanning. Bij overbelasting laat hij de minst belangrijke taken vallen en houdt hij de belangrijke. Dus de computer laat het radarwerk vallen, blijft vliegen, en Armstrong landt met nog een paar seconden brandstof.

Die beslissing is genomen in een kamer in Cambridge, Massachusetts, jaren eerder. Niemand klapte.` },

'alarm-tl': {
  notes: `Loop de tijdlijn van links naar rechts. [[Drie jaar]] tussen de beslissing en het moment dat hij ertoe deed.

Dit is het eerste dat architectuur [[moeilijk]] maakt, en ik zeg het gewoon: [[de feedbackloop wordt gemeten in jaren]]. Van zo'n loop kun je niet leren door hem mee te maken. Je hebt iets anders nodig. Parkeer dat.`,
  script: `Kijk naar het gat. 1966: de executive wordt ontworpen. 1968: Apollo 8 vliegt, er gebeurt niets. 1969: het alarm, en de beslissing betaalt zich uit. Drie jaar tussen beslissen en weten.

Dit is het eerste dat architectuur moeilijk maakt, en ik wil het gewoon zeggen: de feedbackloop wordt gemeten in jaren. Van een loop die zo lang is, kun je niet leren door hem gewoon mee te maken. Je zou tien herhalingen krijgen in een hele loopbaan. We hebben een andere manier van oefenen nodig. Parkeer dat. Daar eindigen we.` },

beck: {
  notes: `Moeilijk voor developers: architectuur [[verstopt zich in pull requests]]. Niemand vertelt je dat wat je net deed architectuur was.

Makkelijker: de regel van [[Kent Beck]]. Maak eerst de verandering makkelijk (waarschuwing: dat kan moeilijk zijn), doe dan de makkelijke verandering. Dat is [[Parnas]] in één zin: [[splits op wat gaat veranderen]].

Elke verdieping krijgt een tool mee. Dit is die van de machinekamer.`,
  script: `Dus, machinekamer. Wat is moeilijk, wat is makkelijker.

Moeilijk: architectuur verstopt zich in jullie pull requests. Je trekt een interface los, je splitst een module, en niemand vertelt je dat dat architectuur was.

Makkelijker: de regel van Kent Beck uit 2012. Voor elke gewenste verandering: maak eerst de verandering makkelijk (waarschuwing: dat kan moeilijk zijn), en doe dan de makkelijke verandering. Dat is het paper van David Parnas uit 1972 in één zin: splits op wat gaat veranderen. Jullie doen dit al. Het enige wat ik van deze verdieping vraag, is het hardop zo te gaan noemen, zodat de andere verdiepingen het horen.` },

f3: {
  notes: `Een verdieping hoger. De seniors. De mensen met "lead" of "architect" ergens in hun titel.

Het waarom voor deze verdieping: een antwoord lost [[de beslissing van vandaag]] op. Een vraag die het team heeft leren stellen, lost [[elke beslissing daarna]] op. Het waardevolste wat een senior met zijn kennis kan doen, is de zaal [[de juiste vragen laten stellen]], en dan [[de trade-off uitleggen]] achter het antwoord.

Het hoe is één gewoonte: [[als laatste spreken]]. Wie eerst spreekt, krijgt de vragen nooit te horen. Alles op deze verdieping bouwt daarnaartoe.`,
  script: `Een verdieping hoger. Seniors, leads, architecten. De mensen die het meeste weten.

Hier is de vraag voor deze verdieping: wat is het waardevolste dat je kunt doen met wat je weet? Het voor de hand liggende antwoord is: het antwoord geven. En een antwoord lost de beslissing van vandaag op. Maar een vraag die het team heeft leren stellen, lost elke beslissing daarna op, ook de beslissingen waar jij niet bij bent.

Dus de taak op deze verdieping is je kennis besteden aan iedereen de juiste vragen laten stellen. Wat verandert hier het meest? Wat maakt dit later duur? Waarom niet de andere optie? En dan, als de vragen op tafel liggen, de trade-off achter je antwoord uitleggen, zodat de zaal leert hoe je denkt en niet alleen wat je concludeerde.

Er is één gewoonte die dit mogelijk maakt, en die is ongemakkelijk: als laatste spreken. Als jij eerst spreekt, worden de vragen nooit gesteld. Ik laat jullie zien waarom die volgorde zo veel uitmaakt.` },

fowler: {
  notes: `De twee archetypes van [[Fowler]]. [[Reloadus]], naar de Matrix: beslist, geeft door, wordt geraadpleegd als een orakel. [[Oryzus]], de rijstboer: werkt op het veld met het team, begeleidt, meet succes aan [[hoe weinig hij nodig is]].

Alleen de namen en de eerste twee punten per kolom zijn zichtbaar, neutraal. Vraag de zaal: [[welke beloont jullie organisatie?]] Neem twee antwoorden. Dan: [[welke heeft ze nodig?]] [[Druk op volgende]]: Oryzus licht op en de laatste twee punten verschijnen, over [[wat het team leert]].

De echte taak van de Oryzus-architect: [[beslissingen zichtbaar maken]], niet alleen nemen.`,
  cue: 'Eén onthulling. Stel beide vragen voordat je op volgende drukt.',
  script: `Hetzelfde artikel van Fowler, twee archetypes. Architectus Reloadus, naar de Matrix: beslist, en geeft door. Neemt de beslissing alleen, communiceert via documenten. Architectus Oryzus, van oryza, rijst: werkt samen, begeleidt, en werkt eraan om te verdwijnen. Werkt binnen het team aan echte problemen, communiceert via gesprek en code.

Een vraag voor jullie. Welke van de twee beloont jullie organisatie? [Neem twee of drie antwoorden. Meestal Reloadus, want Reloadus ziet er daadkrachtig uit.] En welke heeft ze nodig? [Wacht op de zaal. Druk dan op volgende.]

Oryzus. En hier is het deel dat het beslist. Reloadus is het single point of failure voor begrip: het team leert wat er besloten is, nooit waarom, en als Reloadus vertrekt, vertrekt het begrip mee. Oryzus meet succes aan hoe weinig hij nodig is. Het team leert waarom, en kan de volgende keer zonder hem beslissen.

De echte taak van de Oryzus-architect is beslissingen zichtbaar maken, niet ze alleen nemen.` },

silence: {
  notes: `Alleen de bovenste rij is zichtbaar. Senior spreekt eerst, zaal knikt, klaar. Niemand heeft iets geleerd, ook de senior niet. Vraag: [[wat zou jij veranderen?]] Neem één antwoord, [[druk op volgende]].

Onderste rij verschijnt: draai de volgorde om. Junior vraagt [[waarom niet Y]]. Senior moet [[de trade-off hardop zeggen]]. Nu is de beslissing twee keer bekeken, en de junior heeft geleerd wat een senior weet.

[[Jerry Weinberg, 1971]], egoless programming. De mob van [[Woody Zuill]] bij Hunter Industries, 2011: seniors leerden dagelijks van juniors.

Brug: "Maar het antwoord van de senior is toch meestal goed?" Volgende slide: [[Tony Hoare]].`,
  cue: 'Alleen de bovenste rij bij binnenkomst. Vraag wat ze zouden veranderen, druk dan op volgende voor de junior-eerst-rij.',
  script: `Een vergadering waar jullie allemaal in hebben gezeten. De senior zegt: we gebruiken X. De zaal knikt, want wie gaat er tegenin. Beslissing genomen, niet bekeken. Niemand heeft iets geleerd, ook de senior niet.

Wat zou jij veranderen? [Neem één antwoord. Druk dan op volgende.]

Draai de volgorde om. De junior vraagt: waarom niet Y? Nu moet de senior de trade-off hardop zeggen. Nu is de beslissing twee keer bekeken, en de junior heeft net geleerd wat een senior weet.

Jerry Weinberg beschreef dit in 1971 en noemde het egoless programming. Het team van Woody Zuill bij Hunter Industries ontdekte het opnieuw in 2011, toen ze als heel team gingen programmeren, de hele dag, achter één scherm: de seniors zeiden dat ze dagelijks van juniors leerden, omdat de juniors waarom bleven vragen.

Nu hoor ik het bezwaar al. Het antwoord van de senior is toch meestal goed? Laat me jullie voorstellen aan de meest gelauwerde ingenieur in de geschiedenis van ons vak.` },

hoare: {
  notes: `Lees het twee keer. Bij de tweede keer hoort de zaal het verschil tussen [[duidelijk geen fouten]] en [[geen duidelijke fouten]].

Dan de wending op de volgende slide.`,
  script: `Tony Hoare, Turing Award-lezing, 1980. [Lees langzaam.] Er zijn twee manieren om een softwareontwerp te maken. De ene is het zo eenvoudig maken dat er duidelijk geen fouten in zitten. De andere is het zo ingewikkeld maken dat er geen duidelijke fouten in zitten.

Lees het nog eens. "Duidelijk geen fouten." "Geen duidelijke fouten." Dezelfde woorden, tegengestelde systemen. Hou Hoare nog één slide in gedachten.` },

null: {
  notes: `Dezelfde man. [[1965]], ALGOL W, hij voegt de [[null-referentie]] toe omdat die [[makkelijk te implementeren]] was. Niet omdat het goed was. Omdat het makkelijk was.

[[2009]], QCon Londen, hij staat op het podium en noemt het zijn [[miljardenfout]].

Het punt voor de tweede verdieping: de meest senior persoon in de geschiedenis van ons vak leverde een architectuurgat van een miljard op omdat het makkelijk was. [[Seniors zijn geen orakels]]. Het zijn mensen die meer trade-offs kennen.

En precies daarom werkt de tool op de volgende slide.`,
  script: `Dezelfde Tony Hoare. 1965, hij ontwerpt de taal ALGOL W, en hij voegt de null-referentie toe. Waarom? In zijn eigen woorden: omdat het zo makkelijk te implementeren was. Niet omdat het goed was. Omdat het makkelijk was.

2009, QCon Londen. Hij staat op een podium en noemt het zijn miljardenfout, als je de crashes en kwetsbaarheden van veertig jaar software optelt.

Dit is het punt voor de tweede verdieping. De meest gelauwerde ingenieur in de geschiedenis van ons vak leverde een architectuurgat van een miljard op, omdat het die middag de makkelijke optie was. Seniors zijn geen orakels. Seniors zijn mensen die meer trade-offs kennen dan anderen. Dat is waardevol. Het is niet hetzelfde als het antwoord weten.` },

'senior-tool': {
  notes: `De tool voor de tweede verdieping, twee gewoontes in vier woorden. [[Eerst vragen]]: open met een vraag, die uit de intro: wat verandert hier het meest, wat maakt dit later duur, waarom niet de andere optie. [[Als laatste spreken]]: laat de zaal eerst redeneren.

Dan [[de trade-off uitleggen]], niet alleen de conclusie. Zo wordt een beslissing twee keer bekeken en leert het team de volgende zonder jou te nemen.

Terugverwijzing naar Hoare: als de beste van ons een gat van een miljard kan opleveren, is het tweede paar ogen geen beleefdheid. Het is de [[architectuur]].`,
  script: `De tool voor de tweede verdieping. Vier woorden, twee gewoontes.

Eerst vragen. Open elke ontwerpdiscussie met een vraag in plaats van een antwoord. De vragen van een paar minuten geleden volstaan: wat verandert hier het meest? Wat maakt dit later duur? Waarom niet de andere optie?

Als laatste spreken. Laat de zaal redeneren voordat jij het doet. Het voelt traag. Dat is het niet; het is de enige manier waarop de vragen überhaupt gesteld worden.

En dan, als je spreekt, leg de trade-off achter je antwoord uit, niet alleen de conclusie. De beslissing wordt twee keer bekeken, en het team leert hoe jij denkt, wat betekent dat ze de volgende zonder jou kunnen nemen.

Als Tony Hoare een gat van een miljard kan opleveren omdat het die middag makkelijk was, dan is het tweede paar ogen geen beleefdheid. Het is de architectuur.` },

f7: {
  notes: `De verdieping die de meeste architectuurtalks overslaan. [[Product Owners]].

Zeg het direct: [[jullie doen al architectuur]]. Jullie bepalen de [[volgorde]]. Wat het eerst gebouwd wordt, wordt het [[skelet]] waar alles daarna in moet passen, en "later" is een lening met rente. Dat is architectuur in de taal van [[tijd]]. Niemand in de machinekamer vertaalt het.

Bewijs: de beroemdste term in ons vak is uitgevonden [[voor deze verdieping]].`,
  cue: 'Kijk naar de PO\'s. Spreek ze aan op hun rol. Hou deze verdieping kort: twee slides en de vraag.',
  script: `Derde verdieping. Product Owners. De verdieping die de meeste architectuurtalks overslaan, en ik denk dat dat de grootste fout in ons vak is.

[Kijk ze aan.] Jullie doen al architectuur. Jullie bepalen de volgorde. De eerste drie dingen die gebouwd worden, worden het skelet waar alles daarna in moet passen, en elk "later" op je backlog is een lening met rente. Dat is architectuur in de taal van tijd, en niemand in de machinekamer vertaalt het.

Bewijs: de beroemdste term in ons vak is uitgevonden voor jullie verdieping.` },


debt: {
  notes: `De meeste mensen denken dat technical debt een klacht van developers is. Het is het tegenovergestelde.

[[Ward Cunningham, 1992]], het portfoliosysteem WyCash. Hij moet zijn [[niet-technische bazen]] uitleggen waarom nu opleveren en later opschonen een [[legitieme lening]] is, geen slordigheid. Hij leent hun taal: schuld, rente, aflossing.

De meest gebruikte term in ons vak is uitgevonden [[als vertaalmiddel voor de verdieping van de PO]]. De beste architecten verzinnen woorden waarmee twee verdiepingen hetzelfde zien.`,
  script: `Iedereen in deze zaal gebruikt de term "technical debt". De meeste mensen denken dat het een klacht van developers is. Het is het tegenovergestelde.

1992. Ward Cunningham bouwt een portfoliosysteem, WyCash, voor een financieel bedrijf. Hij moet aan zijn bazen, die niet technisch zijn, uitleggen waarom nu opleveren en de code later opschonen een legitieme beslissing is en geen slordigheid. Dus leent hij hun vocabulaire. Het is een lening. Je neemt schuld op om eerder op te leveren, je betaalt rente in de vorm van tragere veranderingen, en op een gegeven moment los je de hoofdsom af. Zijn bazen begrepen het meteen, want hij sprak hun taal.

De meest gebruikte term in softwarearchitectuur is uitgevonden als vertaalmiddel voor de verdieping van de PO. Dat is wat de beste architecten doen. Ze verzinnen woorden waarmee twee verdiepingen hetzelfde zien.` },


'po-tool': {
  notes: `De tool van de PO. [[Eén vraag]], één keer per refinement: [[wat maakt dit later duur?]]

Het is de definitie van Booch, omgezet in een zin die een PO op maandag kan uitspreken zonder te weten wat een service mesh is. Geen toestemming nodig. Geen diagram nodig. En elke keer dat een developer hem beantwoordt, verhuist een stuk van de [[theorie]] van het systeem van het ene hoofd naar het andere.`,
  cue: '"Dit kun je maandag vragen. Je hebt geen toestemming nodig en je hoeft niet te weten wat een service mesh is."',
  script: `De tool voor de derde verdieping is één zin, en het is een vraag over tijd. Wat maakt dit later duur?

Stel hem één keer per refinement, over wat er bovenaan de backlog staat. Je hebt geen diagram nodig. Je hoeft niet te weten wat een service mesh is. Je hebt geen toestemming nodig. Het is de definitie van Booch, omgezet in een vraag die een PO op maandagochtend kan stellen.

En elke keer dat een developer hem beantwoordt, verhuist een stuk van de theorie van het systeem van zijn hoofd naar het jouwe.` },

f12: {
  notes: `Vierde verdieping. [[Scrum Masters]], agile coaches, iedereen die teams vormt.

De ene zin voor deze verdieping: de PO bepaalt [[wanneer]], jullie bepalen [[wie het samen bouwt]]. Dat is architectuur in de taal van [[ruimte]]. Teamgrenzen worden [[systeemgrenzen]], en daar bestaat een vijftig jaar oude wet over.

Opstap: een [[afgewezen paper]].`,
  script: `Vierde verdieping. Scrum Masters, agile coaches, iedereen die teams vormt.

Eén zin voor deze verdieping. De Product Owner bepaalt wanneer. Jullie bepalen wie het samen bouwt. Dat is architectuur in de taal van ruimte: teamgrenzen worden systeemgrenzen. En er is een vijftig jaar oude wet die dat zegt. Die begon als een afgewezen paper.` },
conway: {
  notes: `[[Mel Conway, 1967]]. Paper met de titel "How Do Committees Invent?" Ingestuurd naar Harvard Business Review. [[Afgewezen]]: hij had zijn stelling niet bewezen. Datamation drukte het in 1968. [[Fred Brooks]] noemde het Conway's Law in The Mythical Man-Month en het is sindsdien elk jaar bewezen.

Links: het organogram in januari. Rechts: het systeem in december. [[Dezelfde vorm]]. Altijd.

Dus, Scrum Masters: wie [[de teams splitst]], tekent het architectuurdiagram, of iemand het zo noemt of niet. Volgende slide: hoe je dat [[met opzet]] doet.`,
  script: `1967. Mel Conway schrijft een paper met de titel "How Do Committees Invent?" De stelling: elke organisatie die een systeem ontwerpt, produceert een ontwerp waarvan de structuur een kopie is van de communicatiestructuur van die organisatie. Hij stuurt het naar Harvard Business Review. Ze wijzen het af: hij heeft het niet bewezen. Datamation publiceert het in 1968. Fred Brooks noemt het Conway's Law in The Mythical Man-Month, en het is sindsdien elk jaar opnieuw bewezen.

Links: het organogram in januari. Drie teams. Rechts: het systeem in december. Drie services. Dezelfde vorm. Het is altijd dezelfde vorm.

Dus, Scrum Masters: wie de teams splitst, tekent het architectuurdiagram, of iemand het nu zo noemt of niet. Wat de voor de hand liggende vraag oproept: als het toch gebeurt, kun je het dan met opzet doen?` },

inverse: {
  notes: `Boven: Conway. Teamstructuur wordt systeemstructuur, of je het wilt of niet.

Onder: de [[inverse Conway-manoeuvre]]. Begin bij het systeem dat je wilt. Ontwerp de [[teams]] zo dat ze het opleveren. [[Team Topologies]], Skelton en Pais, 2019: stream-aligned teams, platformteams, [[cognitieve belasting]] als begrenzing.

Dit is [[de architectuurtool van de Scrum Master]]. Toen je voor het laatst een team herschikte, liet iemand je toen het architectuurdiagram zien? Dat had gemoeten. Je was het aan het bewerken.`,
  script: `Ja. Bovenste rij, Conway's Law: teamstructuur wordt systeemstructuur, of je het wilt of niet.

Onderste rij, de inverse Conway-manoeuvre. Begin bij het systeem dat je wilt. Ontwerp de teams zo dat Conway's Law het oplevert. Matthew Skelton en Manuel Pais hebben dit rigoureus gemaakt in Team Topologies, 2019: stream-aligned teams, platformteams, en cognitieve belasting als grens van wat één team kan bezitten.

Dit is de architectuurtool van de Scrum Master. Denk terug aan de laatste keer dat je een team herschikte. Liet iemand je toen het architectuurdiagram zien? Dat had gemoeten. Je was het aan het bewerken.` },

pizza: {
  notes: `Twee Amazon-regels. [[Twee-pizzateams]]: een team is zo groot als twee pizza's kunnen voeden. [[You build it, you run it]], [[Werner Vogels, 2006]]: het team dat een service bouwt, draagt er de pieper voor.

Geen van beide is een technische beslissing. Beide zijn [[organisatiebeslissingen]]. Beide leverden de architectuur op die Amazon wilde: kleine services, duidelijk eigenaarschap, geen muur om over te gooien.

Dat is Conway [[gebruikt]] in plaats van [[ondergaan]]. En het was een zet van de vierde verdieping.`,
  script: `Twee Amazon-regels. Het twee-pizzateam: een team is zo groot als twee pizza's kunnen voeden, en niet groter. En Werner Vogels, 2006: you build it, you run it. Het team dat een service bouwt, draagt er de pieper voor.

Geen van beide is een technische beslissing. Beide zijn organisatorisch. En beide leverden precies de architectuur op die Amazon wilde: kleine services, duidelijk eigenaarschap, niets dat over een muur gegooid wordt.

Dat is Conway met opzet gebruikt in plaats van per ongeluk ondergaan. En het was een zet van de vierde verdieping.` },

spotify: {
  notes: `De waarschuwing voor deze verdieping. [[Henrik Kniberg, 2012]]: een whitepaper over Spotify's squads, tribes, chapters en guilds, als [[momentopname van een experiment]]. De wereld nam het over als [[sjabloon]].

[[2020]]: oud-Spotify-medewerkers zeggen dat het aspirationeel was en dat Spotify verder is gegaan. Het sjabloon overleefde het ding dat het beschreef.

  script: `Een waarschuwing voor deze verdieping. 2012, Henrik Kniberg publiceert een whitepaper over hoe Spotify zich organiseert: squads, tribes, chapters, guilds. Hij noemt het een momentopname van een experiment. De wereld leest het als een sjabloon. Consultancybureaus verkopen het. Bedrijven reorganiseren eromheen.

'sm-tool': {

  script: `De tool voor de vierde verdieping. Over een paar minuten doen we een architectuurkata: kleine groepen, een fictieve opdracht van één pagina, een timebox, dan aan elkaar presenteren en vragen beantwoorden.

kay: {
